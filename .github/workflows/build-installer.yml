name: Build Installers

on:
  workflow_dispatch:
  push:
    branches:
      - feat/windows-installer

jobs:
  build-windows-installer:
    name: Build Windows Installer (Inno Setup)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Select pinned npm
        run: npm install --global npm@12.2.0

      - name: Build React Frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: 'pip'

      - name: Install backend dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build Backend with PyInstaller
        run: |
          pyinstaller --noconfirm evora.spec

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: desktop/go.sum

      - name: Build Go Desktop WebView2 Supervisor
        run: |
          cd desktop
          go build -ldflags "-H windowsgui -s -w" -o evora-workstation.exe .

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: Download Visual C++ Redistributable for Bundling
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "installer/vc_redist.x64.exe"

      - name: Compile Windows Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\setup.iss

      - name: Upload Windows Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EVORA-Setup-Windows-x64
          path: dist/EVORA-Setup-Windows-x64.exe

  build-linux-package:
    name: Build Linux Portable Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Select pinned npm
        run: npm install --global npm@12.2.0

      - name: Build React Frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: 'pip'

      - name: Install backend dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build Standalone Executable
        run: |
          pyinstaller --noconfirm evora.spec

      - name: Package Linux Archive with Install Scripts
        run: |
          cp installer/install-linux.sh dist/evora/install.sh
          cp installer/uninstall-linux.sh dist/evora/uninstall.sh
          chmod +x dist/evora/install.sh dist/evora/uninstall.sh
          cd dist
          tar -czvf evora-linux-x86_64.tar.gz evora/

      - name: Upload Linux Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: evora-linux-x86_64
          path: dist/evora-linux-x86_64.tar.gz
