name: Build and Publish Application Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.2.1'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Select pinned npm
        run: npm install --global npm@12.2.0

      - name: Build frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: 'pip'

      - name: Install backend dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build standalone executable with PyInstaller
        run: |
          pyinstaller --noconfirm evora.spec

      - name: Smoke test frozen application
        run: python scripts/smoke_release.py dist/evora/evora

      - name: Package Linux distribution archive
        run: |
          cp installer/install-linux.sh dist/evora/install.sh
          cp installer/uninstall-linux.sh dist/evora/uninstall.sh
          chmod +x dist/evora/install.sh dist/evora/uninstall.sh
          cd dist
          tar -czvf evora-linux-x86_64.tar.gz evora/

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: evora-linux-x86_64
          path: dist/evora-linux-x86_64.tar.gz

  build-windows:
    name: Build Windows Binary
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Select pinned npm
        run: npm install --global npm@12.2.0

      - name: Build frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: 'pip'

      - name: Install backend dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Test native Windows credential protection and OAuth callback
        env:
          EVORA_CONTRACT_BUNDLE: ${{ runner.temp }}/evora-openapi.json
        run: |
          node scripts/bundle-openapi.mjs specs/openapi.yaml "$env:EVORA_CONTRACT_BUNDLE" frontend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest backend.tests.test_chatgpt_connection -v

      - name: Build standalone executable with PyInstaller
        run: |
          pyinstaller --noconfirm evora.spec

      - name: Smoke test frozen application
        run: python scripts/smoke_release.py dist/evora/evora.exe

      - name: Retain failed Windows bundle for diagnosis
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundle-diagnostics
          path: |
            dist/evora/
            build/evora/warn-evora.txt

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: desktop/go.sum

      - name: Build desktop supervisor
        run: go build -C desktop -ldflags "-H windowsgui -s -w" -o evora-workstation.exe .

      - name: Prepare installer tools and runtime
        shell: pwsh
        run: |
          choco install innosetup --no-progress
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "installer/vc_redist.x64.exe"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: EVORA-Setup-Windows-x64
          path: dist/EVORA-Setup-Windows-x64.exe

      - name: Package Windows distribution zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/evora -DestinationPath dist/evora-windows-x64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: evora-windows-x64
          path: dist/evora-windows-x64.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: evora-linux-x86_64
          path: release-assets/

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: evora-windows-x64
          path: release-assets/

      - uses: actions/download-artifact@v4
        with:
          name: EVORA-Setup-Windows-x64
          path: release-assets/

      - name: Generate checksums
        run: sha256sum release-assets/evora-linux-x86_64.tar.gz release-assets/evora-windows-x64.zip release-assets/EVORA-Setup-Windows-x64.exe | sed 's@release-assets/@@' > release-assets/SHA256SUMS

      - name: Create GitHub Release and attach binaries
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: EVORA ${{ github.event.inputs.version || github.ref_name }}
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          body_path: docs/releases/v1.2.1.md
          files: |
            release-assets/evora-linux-x86_64.tar.gz
            release-assets/evora-windows-x64.zip
            release-assets/EVORA-Setup-Windows-x64.exe
            release-assets/SHA256SUMS
          draft: true
          prerelease: false
          generate_release_notes: false
