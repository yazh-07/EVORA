name: Build and Publish Application Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install backend dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build standalone executable with PyInstaller
        run: |
          pyinstaller --noconfirm evora.spec

      - name: Package Linux distribution archive
        run: |
          cd dist
          tar -czvf evora-linux-x86_64.tar.gz evora/

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: evora-linux-x86_64
          path: dist/evora-linux-x86_64.tar.gz

  build-windows:
    name: Build Windows Binary
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install backend dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build standalone executable with PyInstaller
        run: |
          pyinstaller --noconfirm evora.spec

      - name: Package Windows distribution zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/evora -DestinationPath dist/evora-windows-x64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: evora-windows-x64
          path: dist/evora-windows-x64.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: evora-linux-x86_64
          path: release-assets/

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: evora-windows-x64
          path: release-assets/

      - name: Create GitHub Release and attach binaries
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release-assets/evora-linux-x86_64.tar.gz
            release-assets/evora-windows-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
