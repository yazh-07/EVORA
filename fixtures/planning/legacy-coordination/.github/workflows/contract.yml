name: Coordination and contract checks

on:
  pull_request:
  push:
    branches: [main, docs/coordination-foundation]

permissions:
  contents: read

jobs:
  coordination:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install wire-example validation dependency
        run: python -m pip install jsonschema==4.25.1
      - name: Validate shared OpenAPI contract
        run: npx --yes @redocly/cli@2.57.0 lint specs/openapi.yaml
      - name: Bundle contract for structural checks
        run: npx --yes @redocly/cli@2.57.0 bundle specs/openapi.yaml --output "$RUNNER_TEMP/evora-openapi.json"
      - name: Generate and check TypeScript declarations
        run: |
          npx --yes openapi-typescript@7.10.1 specs/openapi.yaml -o "$RUNNER_TEMP/evora-api.d.ts"
          npx --yes --package typescript@5.9.3 tsc --noEmit "$RUNNER_TEMP/evora-api.d.ts"
      - name: Check phases, task dependencies, scope coverage, docs and fixtures
        run: python scripts/verify_coordination.py "$RUNNER_TEMP/evora-openapi.json"
      - name: Run verifier negative tests and synthetic wire examples
        env:
          EVORA_CONTRACT_BUNDLE: ${{ runner.temp }}/evora-openapi.json
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Validate design tokens and contrast
        run: npx --yes @google/design.md@0.4.0 lint DESIGN.md
      - name: Check commit whitespace
        run: git show --format= --check HEAD
