    AuthSetupInput: {"type": "object", "additionalProperties": false, "properties": {"username": {"type": "string", "minLength": 1, "maxLength": 64, "pattern": "^[A-Za-z0-9][A-Za-z0-9_.-]*$"}, "password": {"type": "string", "minLength": 12, "maxLength": 256}, "display_name": {"type": "string", "minLength": 1, "maxLength": 120}}, "required": ["username", "password", "display_name"]}
    AuthStatus: {"type": "object", "additionalProperties": false, "properties": {"setup_required": {"type": "boolean"}, "offline_mode": {"type": "boolean"}, "database_encrypted": {"type": "boolean", "description": "The local SQLite database uses SQLCipher encryption at rest."}, "database_locked": {"type": "boolean", "description": "Password or recovery-code unlock is required before database access."}}, "required": ["setup_required", "offline_mode"]}
