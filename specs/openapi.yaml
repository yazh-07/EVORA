      properties:
        vision_use_qa_model: { type: boolean }
        vision_model: { type: string, maxLength: 200, description: Separate vision-capable model for explicit image description and model-assisted text extraction. }
        offline_mode: { type: boolean, description: Administrator-controlled local-only or hosted-provider operation. }
        qa_provider: { type: string, enum: [ollama, openai, chatgpt] }
        openai_base_url: { type: string, format: uri }
        openai_api_key:
          type: [string, 'null']
          writeOnly: true
          description: A non-empty key replaces the saved backend key; omitted, null or empty keys retain it.
        qa_model: { type: string, minLength: 1, maxLength: 200 }
        qa_url: { type: string, format: uri }
        detection_threshold: { type: number, minimum: 0.1, maximum: 1.0 }
        show_provenance_rays: { type: boolean }
    ApiError:
