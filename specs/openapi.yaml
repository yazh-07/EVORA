}, "404": {"description": "Request rejected", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ApiError"}}}}, "409": {"description": "Request rejected", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ApiError"}}}}, "429": {"description": "Request rejected", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ApiError"}}}}}, "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/UpdateCaseMember"}}}}, "parameters": [{"name": "caseId", "in": "path", "required": true, "schema": {"type": "string", "format": "uuid"}}]}}
  /api/v1/settings:
    get:
      operationId: getSettings
      summary: Read current workstation settings
      responses:
        '200':
          description: Current runtime settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      operationId: updateSettings
      summary: Update runtime settings without restarting the workstation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettingsUpdate' }
      responses:
        '200':
          description: Updated runtime settings; omitted fields are unchanged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/settings/models:
    post:
      operationId: listProviderModels
      summary: Test an Ollama or OpenAI-compatible endpoint and fetch models without saving settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                offline_mode: { type: boolean, description: Administrator-selected draft mode for this connection test only; does not save settings. }
                qa_provider: { type: string, enum: [ollama, openai, chatgpt] }
                qa_url: { type: string, format: uri }
                openai_base_url: { type: string, format: uri }
                openai_api_key:
                  type: [string, 'null']
                  writeOnly: true
                  description: Omitted or empty keys use the saved backend key.
      responses:
        '200':
          description: Connection succeeded
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [models]
                properties:
                  models:
                    type: array
                    items: { type: string }
                  vision_models:
                    type: array
                    description: Model IDs advertising image input when the provider supplies modality metadata. Omitted when unknown.
                    items: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502':
          description: Provider is unavailable or returned an invalid model list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/cases:
    post:
      tags: [Cases]
      operationId: createCase
      summary: Create a case
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCase' }
      responses:
        '201':
          description: Case created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Case' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      tags: [Cases]
      operationId: listCases
      summary: List accessible cases
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Authorized cases only
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CasePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/cases/{caseId}:
    parameters:
      - { $ref: '#/components/parameters/CaseId' }
    get:
      tags: [Cases]
      operationId: getCase
      summary: Read a case
      responses:
        '200':
          description: Case detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Case' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/cases/{caseId}/evidence:
    parameters:
      - { $ref: '#/components/parameters/CaseId' }
    post:
      tags: [Evidence]
      operationId: uploadEvidence
      summary: Store original evidence
      description: >-
        Stream and hash the original bytes before analysis. Never trust the
        client filename as a storage path. Do not process the file inline.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, source_label, kind]
              properties:
                file: { type: string, format: binary }
                source_label: { type: string, minLength: 1 }
                kind: { $ref: '#/components/schemas/EvidenceKind' }
                acquired_at: { type: string, format: date-time }
      responses:
        '201':
          description: Stored original evidence
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Evidence' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
    get:
      tags: [Evidence]
      operationId: listEvidence
      summary: List case evidence
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Evidence list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidencePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/cases/{caseId}/evidence/{evidenceId}:
    parameters:
      - { $ref: '#/components/parameters/CaseId' }
      - { $ref: '#/components/parameters/EvidenceId' }
    get:
      tags: [Evidence]
      operationId: getEvidence
      summary: Read evidence metadata
      responses:
        '200':
          description: Evidence metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Evidence' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/cases/{caseId}/evidence/{evidenceId}/content:
    parameters:
      - { $ref: '#/components/parameters/CaseId' }
      - { $ref: '#/components/parameters/EvidenceId' }
    get:
      tags: [Evidence]
      operationId: downloadEvidence
      summary: Download original evidence bytes
      description: >-
        Authorized download of unmodified original bytes; never expose a server path.
        U14 uses these bytes in an in-memory media Blob/object URL for local playback
        and seeks using media-time source_locator offsets. Revoke URLs on disposal;
        no persistent browser evidence cache, remote media URL, new playback endpoint
        or HTTP Range/206 support is promised by this contract.
      responses:
        '200':
          description: Original bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/cases/{caseId}/evidence/{evidenceId}/processing-runs/interpret-as:
    post:
      tags: [Processing]
      operationId: interpretEvidence
      summary: Interpret an existing document as a structured CSV export
      description: >-
        Creates a new immutable processing run using the selected CSV adapter.
        Preserves original bytes, uploaded document kind, hashes and all earlier runs.
        The frozen configuration records the original source kind and selected parser.
        Normal case authorization, parser validation and idempotency checks apply.
      parameters:
        - { $ref: '#/components/parameters/CaseId' }
        - { $ref: '#/components/parameters/EvidenceId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind]
              properties:
                kind: { type: string, enum: [mobile_log, network_log, gps, message, transaction] }
      responses:
        '202':
          description: Structured interpretation queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcessingRun' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
  /api/v1/cases/{caseId}/evidence/{evidenceId}/processing-runs:
    parameters:
      - { $ref: '#/components/parameters/CaseId' }
      - { $ref: '#/components/parameters/EvidenceId' }
    post:
      tags: [Processing]
      operationId: startProcessing
      summary: Start an evidence processing run
      description: >-
        Freeze a processing configuration at acceptance. Reusing the same key
        with the same request returns the original run, including failed runs;
        retry/reprocess with a new key. Different evidence target with the same
        actor/case/operation key returns 409. Processing output is immutable.
        Upload preserves originals independently of processing support. Image
        requests validate stored bytes and decoding limits before creating a run;
        invalid or unsupported image bytes return 415 UNSUPPORTED_MEDIA with no
        run or partial output. MIME type and filename alone do not decide support.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '202':
          description: Processing queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcessingRun' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
    get:
      tags: [Processing]
      operationId: listProcessingRuns
      summary: List evidence processing runs
      responses:
        '200':
          description: Processing history, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProcessingRun' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/cases/{caseId}/evidence/{evidenceId}/processing-runs/{runId}:
    parameters:
      - { $ref: '#/components/parameters/CaseId' }
      - { $ref: '#/components/parameters/EvidenceId' }
      - { $ref: '#/components/parameters/RunId' }
    get:
      tags: [Processing]
      operationId: getProcessingRun
      summary: Poll an evidence processing run
      responses:
        '200':
          description: Processing run state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcessingRun' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/cases/{caseId}/observations:
    parameters:
      - { $ref: '#/components/parameters/CaseId' }
    get:
      tags: [Processing]
      operationId: listObservations
      summary: List extracted observations
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
        - name: evidence_id
          in: query
          schema: { type: string, format: uuid }
        - name: processing_run_id
          in: query
          description: >-
            Optional completed run selector for historical provenance. Without
            it, return outputs of the latest completed run per evidence using
            finished_at UTC then UUID. Failed/running outputs are never visible.
            Both filters must identify same-case resources; mismatch returns 404.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Case-scoped normalized observations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ObservationPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/cases/{caseId}/observations/{observationId}/transcript-revisions:
    parameters:
      - { $ref: '#/components/parameters/CaseId' }
      - name: observationId
        in: path
        required: true
        description: Original machine transcript.segment observation, never a derived correction observation.
        schema: { type: string, format: uuid }
    post:
      tags: [Investigation]
      operationId: appendTranscriptRevision
      summary: Append an immutable human transcript correction
      description: >-
        U14B: authorize every referenced resource in the same case and evidence.
        The path observation must be a machine transcript.segment in the supplied
        original completed processing_run_id. Missing/foreign/mismatched references
        return 404; a non-transcript target returns 400. Require base_processing_run_id
        to be the latest completed output for this evidence and expected_latest_revision_id
        to equal this source segment's latest revision (null for the first); stale
        values or a base no longer containing the original segment lineage return
        409; do not auto-rebase across re-transcription. Prepare a complete derived
        output from that base, copying
        unaffected observations with new IDs and retaining their provenance, replacing
        this segment's effective text and rebuilding dependent candidate entities/events.
        Atomically append revision, publish a new completed ProcessingRun and all its
        output, and append one safe audit reference without transcript/reason contents.
        Completion ordering must be strictly after the base; serialize with concurrent
        processing publication. Carry forward other segments' effective revisions.
        Every copied transcript segment exposes source_observation_id pointing to its
        original machine root, even when it has no correction/revision yet.
        Compare both preconditions again
        at publication; failures expose no revision or partial output. Preserve original
        bytes/hash, machine transcript, earlier revisions/runs and analysis snapshots.
        New analysis keys select this derived completed run through existing snapshot
        rules; original-key replay retains old inputs. Neither startProcessing nor
        startAnalysis gains a request body. Replayed identical revision requests return
        the original 201 result before checking stale preconditions, with access rechecked.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTranscriptRevision' }
      responses:
        '201':
          description: Immutable revision and complete derived processing output published atomically
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TranscriptRevision' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [Investigation]
      operationId: listTranscriptRevisions
      summary: List immutable corrections against the original machine segment
      description: >-
        Same-case original machine transcript.segment only; missing/foreign target
        returns 404, non-transcript target returns 400. Order by created_at UTC then
        revision UUID ascending before pagination. History is never a mutable overlay
        on historical observations or analytical snapshots.
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Append-only correction history, oldest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TranscriptRevisionPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/cases/{caseId}/entities:
    parameters:
      - { $ref: '#/components/parameters/CaseId' }
    get:
      tags: [Processing]
      operationId: listEntities
      summary: List case-scoped candidate entities
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Source-backed candidate entities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntityPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/cases/{caseId}/events:
    parameters:
      - { $ref: '#/components/parameters/CaseId' }
    get:
      tags: [Processing]
      operationId: listEvents
      summary: List extracted case events
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Source-backed candidate events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/cases/{caseId}/analysis-runs:
    parameters:
      - { $ref: '#/components/parameters/CaseId' }
    post:
      tags: [Analysis]
      operationId: startAnalysis
      summary: Start or repeat case analysis
      description: >-
        Freeze input_snapshot at acceptance, selecting the latest completed
        processing run per evidence by finished_at UTC then UUID. Include all
        currently uploaded evidence IDs, including unprocessed items. Derive
        trigger as initial when no completed analysis exists, new_observations
        when the snapshot hash differs from the latest completed analysis, or
        manual otherwise. No trigger request field exists. Reusing a key returns
        the original run before any new snapshot is selected. A new key requests
        a new run. Publish graph, findings and available triage together only
        after the case/run-scoped Neo4j projection verifies; hide partial outputs.
        Never score unprocessed items with fabricated factors. Retain old runs.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '202':
          description: Analysis accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisRun' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [Analysis]
      operationId: listAnalysisRuns
      summary: List case analysis runs
      responses:
        '200':
          description: Runs in creation order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AnalysisRun' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/cases/{caseId}/analysis-runs/{runId}:
    parameters:
      - { $ref: '#/components/parameters/CaseId' }
      - { $ref: '#/components/parameters/RunId' }
    get:
      tags: [Analysis]
      operationId: getAnalysisRun
      summary: Poll a case analysis run
      responses:
        '200':
          description: Analysis run state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisRun' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/cases/{caseId}/graph:
    parameters:
      - { $ref: '#/components/parameters/CaseId' }
    get:
      tags: [Analysis]
      operationId: getGraph
      summary: Read the latest case graph
      description: >-
        Latest completed run ordered by created_at UTC then UUID, not finish
        order; empty graph without analysis_run_id when no completed run exists.
        Every nonempty graph includes its analysis_run_id. All graph IDs and
        supporting observations belong to the authorized case/run partition.
      parameters:
        - { $ref: '#/components/parameters/AnalysisRunSelector' }
      responses:
        '200':
          description: Evidence-backed relationships
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Graph' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/cases/{caseId}/findings:
    parameters:
      - { $ref: '#/components/parameters/CaseId' }
    get:
      tags: [Analysis]
      operationId: listFindings
      summary: List latest case findings
      parameters:
        - { $ref: '#/components/parameters/AnalysisRunSelector' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Latest completed findings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FindingPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/cases/{caseId}/findings/{findingId}/reviews:
    parameters:
      - { $ref: '#/components/parameters/CaseId' }
      - { $ref: '#/components/parameters/FindingId' }
    post:
      tags: [Investigation]
      operationId: reviewFinding
      summary: Record a human finding review
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReview' }
      responses:
        '201':
          description: Audited review decision (append-only)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewDecision' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      tags: [Investigation]
      operationId: listFindingReviews
      summary: Read append-only review history
      responses:
        '200':
          description: Review decisions, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ReviewDecision' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/cases/{caseId}/triage:
    parameters:
      - { $ref: '#/components/parameters/CaseId' }
    get:
      tags: [Analysis]
      operationId: listTriage
      summary: List latest priorities
      description: >-
        Select the same-case completed analysis_run_id, or latest completed run by
        (created_at UTC, id UUID) when omitted; missing, foreign, pending or failed
        selectors return 404. For a selected completed run, membership is exactly
        AnalysisRun.input_snapshot.evidence_ids, including unscored evidence, and
        total is that manifest's count. Return TriagePage.analysis_run_id even for
        empty or entirely unscored pages; latest_result, when present, belongs to
        the selected run. Sort scored entries by pinned latest_result.score
        descending, ties by evidence UUID lexically ascending, then unscored
        entries by evidence UUID ascending, before limit/offset slicing. Later
        uploads, processing or analyses cannot change pinned membership, total,
        automated results or ordering. Only before any completed analysis, an
        unselected read lists live uploaded case evidence, unscored with no
        latest_result, live total and evidence UUID ascending order.
        On each read, override is the live latest authorized same-case override
        for that evidence by (created_at UTC, id UUID), not an automated snapshot
        field. effective_priority is its priority, otherwise the selected
        automated priority, and is omitted if neither exists. Override changes
        must not reorder the list, change membership/total or cause pagination
        duplicates/skips; clients must not re-sort by effective priority.
        getTriageHistory remains immutable append-only automated results.
      parameters:
        - { $ref: '#/components/parameters/AnalysisRunSelector' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Selected-run automated results (or pre-analysis unscored uploads) with live authorized override overlays
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TriagePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/cases/{caseId}/evidence/{evidenceId}/triage-history:
    parameters:
      - { $ref: '#/components/parameters/CaseId' }
      - { $ref: '#/components/parameters/EvidenceId' }
    get:
      tags: [Analysis]
      operationId: getTriageHistory
      summary: Read automated priority history
      responses:
        '200':
          description: Append-only automated ranking history, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TriageResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/cases/{caseId}/evidence/{evidenceId}/priority-overrides:
    parameters:
      - { $ref: '#/components/parameters/CaseId' }
      - { $ref: '#/components/parameters/EvidenceId' }
    post:
      tags: [Investigation]
      operationId: setPriorityOverride
      summary: Record a manual priority override
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOverride' }
      responses:
        '201':
          description: Recorded manual override, never changes automated history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriorityOverride' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/cases/{caseId}/questions:
    parameters:
      - { $ref: '#/components/parameters/CaseId' }
    post:
      tags: [Investigation]
      operationId: askCaseQuestion
      summary: Ask a case-grounded question
      description: Grounded retrieval; insufficient support yields supported=false and no invented answer.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CaseQuestion' }
      responses:
        '200':
          description: Case-grounded answer or unsupported result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseAnswer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/cases/{caseId}/reports:
    parameters:
      - { $ref: '#/components/parameters/CaseId' }
    post:
      tags: [Investigation]
      operationId: generateReport
      summary: Generate a model-written draft from a completed analysis
      description: Uses frozen processing outputs, validates source references and performs a model entailment check. Records private provenance. Human review remains required. Hosted providers require explicit sharing consent and online mode.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportRequest' }
      responses:
        '200':
          description: Source-checked report draft, citations and bounded context coverage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GeneratedReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/cases/{caseId}/audit-events:
    parameters:
      - { $ref: '#/components/parameters/CaseId' }
    get:
      tags: [Investigation]
      operationId: listAuditEvents
      summary: List case audit events
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Audit trail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    localSession:
      type: apiKey
      in: cookie
      name: evora_session
    bearerAuth:
      type: http
      scheme: bearer
      description: Identity provider and roles TBD; no hard-coded demo token in production.
  parameters:
    CaseId:
      name: caseId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EvidenceId:
      name: evidenceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FindingId:
      name: findingId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    AnalysisRunSelector:
      name: analysis_run_id
      in: query
      description: >-
        Pin a completed same-case snapshot across graph/findings/triage and
        pagination. Omit for latest completed run by created_at UTC then UUID.
        Foreign, missing, failed or incomplete run returns 404. Clients pin the
        returned run ID across related reads to avoid mixed-run displays.
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
      description: >-
        Scope to authenticated actor, case and operation. Fingerprint method,
        target path and explicit request parameters/body, not mutable server
        state. Same key with identical request returns the stored run; changed
        request returns 409. New data/configuration requires a new key to select
        a fresh snapshot. Enforce case access again on every replay.
