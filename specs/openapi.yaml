        offline_mode: { type: boolean }
        qa_provider: { type: string, enum: [ollama, openai, chatgpt], default: ollama }
        openai_base_url: { type: string, format: uri, default: 'https://api.openai.com/v1' }
        has_openai_key: { type: boolean, readOnly: true }
        has_chatgpt_connection: { type: boolean, readOnly: true }
        qa_model: { type: string, minLength: 1, maxLength: 200, default: 'deepseek-r1:8b' }
        qa_url: { type: string, format: uri, default: 'http://127.0.0.1:11434' }
        detection_threshold: { type: number, minimum: 0.1, maximum: 1.0, default: 0.7 }
        show_provenance_rays: { type: boolean, default: true }
    SettingsUpdate:
      type: object
