    ImageAnalysisRequest: {"type": "object", "additionalProperties": false, "required": ["expected_provider", "expected_model", "expected_endpoint"], "properties": {"confirm_external_processing": {"type": "boolean", "default": false}, "expected_provider": {"type": "string", "enum": ["ollama", "openai", "chatgpt"]}, "expected_model": {"type": "string", "minLength": 1, "maxLength": 200}, "expected_endpoint": {"type": "string", "minLength": 1, "maxLength": 2000}}}
    LocalUser: {"type": "object", "additionalProperties": false, "properties": {"id": {"type": "string", "format": "uuid"}, "username": {"type": "string"}, "display_name": {"type": "string"}, "role": {"type": "string", "enum": ["administrator", "investigator", "reviewer"]}, "disabled": {"type": "boolean"}, "must_change_password": {"type": "boolean"}}, "required": ["id", "username", "display_name", "role", "disabled", "must_change_password"]}
