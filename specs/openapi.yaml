    RecoverLocalAccount: {"type": "object", "additionalProperties": false, "properties": {"username": {"type": "string", "minLength": 1, "maxLength": 64}, "recovery_code": {"type": "string", "minLength": 1, "maxLength": 200}, "new_password": {"type": "string", "minLength": 12, "maxLength": 256}}, "required": ["username", "recovery_code", "new_password"]}
    CaseMemberList: {"type": "object", "additionalProperties": false, "properties": {"items": {"type": "array", "items": {"type": "object", "additionalProperties": false, "properties": {"id": {"type": "string", "format": "uuid"}, "username": {"type": "string"}, "display_name": {"type": "string"}, "role": {"type": "string", "enum": ["administrator", "investigator", "reviewer"]}}, "required": ["id", "username", "display_name", "role"]}}}, "required": ["items"]}
    UpdateCaseMember: {"type": "object", "additionalProperties": false, "properties": {"user_id": {"type": "string", "format": "uuid"}, "grant": {"type": "boolean"}}, "required": ["user_id", "grant"]}
