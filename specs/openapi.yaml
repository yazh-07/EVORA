openapi: 3.1.0
info:
  title: EVORA case investigation API
  version: 0.3.0
  description: >-
    Proposed v1 wire contract for team review. An investigation aid, not a
    forensic certification or a determination of guilt. All case-scoped
    resources must be authorized for that case. No endpoint may return data
    from a different case. See docs/INTEGRATION.md for workflow semantics.
servers:
  - url: http://{host}:{port}
    description: Local development defaults; clients configure their actual base URL.
    variables:
      host:
        default: 127.0.0.1
      port:
        default: '8000'
security:
  - localSession: []
  - bearerAuth: []
tags:
  - name: Cases
    description: Case identity and access scope.
  - name: Evidence
    description: Preserve and retrieve original artifacts.
  - name: Processing
    description: Extract case-scoped observations from originals.
  - name: Analysis
    description: Build findings and versioned automated priorities.
  - name: Investigation
    description: Human decisions, case questions and audit trail.
paths:
  /api/v1/chatgpt/status: {"get": {"operationId": "getChatGPTStatus", "summary": "Read the workstation ChatGPT connection status", "responses": {"200": {"description": "Success", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ChatGPTStatus"}}}}, "400": {"description": "Rejected request", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ApiError"}}}}, "401": {"description": "Rejected request", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ApiError"}}}}, "403": {"description": "Rejected request", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ApiError"}}}}}}}
  /api/v1/chatgpt/connect: {"post": {"operationId": "connectChatGPT", "summary": "Start ChatGPT authorization for this workstation", "responses": {"200": {"description": "Success", "content": {"application/json": {"schema": {"type": "object", "additionalProperties": false, "required": ["authorization_url"], "properties": {"authorization_url": {"type": "string", "format": "uri"}}}}}}, "400": {"description": "Rejected request", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ApiError"}}}}, "401": {"description": "Rejected request", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ApiError"}}}}, "403": {"description": "Rejected request", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ApiError"}}}}}, "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "additionalProperties": false, "properties": {"offline_mode": {"type": "boolean"}, "new_account": {"type": "boolean"}}}}}}}}
  /api/v1/chatgpt/disconnect: {"post": {"operationId": "disconnectChatGPT", "summary": "Disconnect the workstation ChatGPT account", "responses": {"200": {"description": "Success", "content": {"application/json": {"schema": {"type": "object", "additionalProperties": false, "required": ["disconnected", "revoked"], "properties": {"disconnected": {"type": "boolean"}, "revoked": {"type": "boolean"}}}}}}, "400": {"description": "Rejected request", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ApiError"}}}}, "401": {"description": "Rejected request", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ApiError"}}}}, "403": {"description": "Rejected request", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ApiError"}}}}}}}
  /api/v1/cases/{caseId}/evidence/{evidenceId}/video-analysis: {"post": {"operationId": "analyzeVideo", "summary": "Analyze sampled video frames, geometric candidate tracks and optional local speech", "description": "Creates a new immutable processing run. Hosted providers require explicit consent and matching expected provider, model, and endpoint. No automatic cloud transmission during ordinary extraction.", "parameters": [{"name": "caseId", "in": "path", "required": true, "schema": {"type": "string", "format": "uuid"}}, {"name": "evidenceId", "in": "path", "required": true, "schema": {"type": "string", "format": "uuid"}}, {"name": "Idempotency-Key", "in": "header", "required": true, "schema": {"type": "string", "format": "uuid"}}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/VideoAnalysisRequest"}}}}, "responses": {"202": {"description": "Queued processing run", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ProcessingRun"}}}}, "400": {"description": "Request rejected", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ApiError"}}}}, "401": {"description": "Request rejected", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ApiError"}}}}, "403": {"description": "Request rejected", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ApiError"}}}}, "404": {"description": "Request rejected", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ApiError"}}}}, "409": {"description": "Request rejected", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ApiError"}}}}, "415": {"description": "Request rejected", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ApiError"}}}}}}}
  /api/v1/media-capabilities: {"get": {"operationId": "getMediaCapabilities", "summary": "Read locally available video and speech capabilities", "responses": {"401": {"$ref": "#/components/responses/Unauthorized"}, "200": {"description": "Installed media tools", "content": {"application/json": {"schema": {"type": "object", "additionalProperties": false, "required": ["video_audio_tools", "local_speech_ready"], "properties": {"video_audio_tools": {"type": "boolean"}, "local_speech_ready": {"type": "boolean"}}}}}}}}}
  /api/v1/cases/{caseId}/evidence/{evidenceId}/image-analysis: {"post": {"operationId": "analyzeImage", "summary": "Describe an image and transcribe visible text with the configured vision model", "description": "Creates a new immutable processing run. Hosted providers require explicit consent and matching expected provider, model, and endpoint. No automatic cloud transmission during ordinary extraction.", "parameters": [{"name": "caseId", "in": "path", "required": true, "schema": {"type": "string", "format": "uuid"}}, {"name": "evidenceId", "in": "path", "required": true, "schema": {"type": "string", "format": "uuid"}}, {"name": "Idempotency-Key", "in": "header", "required": true, "schema": {"type": "string", "format": "uuid"}}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ImageAnalysisRequest"}}}}, "responses": {"202": {"description": "Queued processing run", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ProcessingRun"}}}}, "400": {"description": "Request rejected", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ApiError"}}}}, "401": {"description": "Request rejected", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ApiError"}}}}, "403": {"description": "Request rejected", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ApiError"}}}}, "404": {"description": "Request rejected", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ApiError"}}}}, "409": {"description": "Request rejected", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ApiError"}}}}, "415": {"description": "Request rejected", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ApiError"}}}}}}}
  /api/v1/auth/status: {"get": {"operationId": "getAuthStatus", "summary": "getAuthStatus", "description": "Offline local account operation. Mutations require X-Evora-Request: 1 and a same-origin request.", "responses": {"200": {"description": "Success", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AuthStatus"}}}}, "400": {"description": "Request rejected", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ApiError"}}}}, "401": {"description": "Request rejected", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ApiError"}}}}, "403": {"description": "Request rejected", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ApiError"}}}}, "404": {"description": "Request rejected", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ApiError"}}}}, "409": {"description": "Request rejected", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ApiError"}}}}, "429": {"description": "Request rejected", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ApiError"}}}}}, "security": []}}
