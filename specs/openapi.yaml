      required: [id, case_id, kind, filename, media_type, source_label, sha256, size_bytes, created_at]
      properties:
        id: { type: string, format: uuid }
        case_id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/EvidenceKind' }
        filename: { type: string }
        media_type: { type: string }
        source_label: { type: string }
        acquired_at: { type: string, format: date-time }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        size_bytes: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
    RunStatus:
      type: string
      enum: [queued, running, completed, failed]
    ProcessingRun:
      allOf:
        - if:
            properties:
              status: { enum: [completed, failed] }
            required: [status]
          then:
            properties:
              finished_at: { type: string, format: date-time }
            required: [finished_at]
        - if:
            properties:
              status: { const: failed }
            required: [status]
          then:
            properties:
              error: { type: string, minLength: 1 }
            required: [error]
      type: object
      additionalProperties: false
      required: [id, case_id, evidence_id, status, processor_version, created_at]
      properties:
        id: { type: string, format: uuid }
        case_id: { type: string, format: uuid }
        evidence_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/RunStatus' }
        processor_version: { type: string }
        source_kind: { type: string, enum: [document], description: Original uploaded kind retained when using structured interpretation. }
        processing_kind: { type: string, enum: [mobile_log, network_log, gps, message, transaction], description: Adapter selected for this immutable interpretation run. }
        created_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        error: { type: string }
    Observation:
      description: >-
        P16 local audio/video speech transcription emits transcript.segment observations;
        raw_value is the immutable machine text and normalized_value is effective text.
        Unclear spans use [unclear], not invented words; silence/no audio emits one
        transcript.status with normalized_value silence or no_audio and no segments.
        extraction_confidence is an uncalibrated model score, not truth, identity or
        source reliability; unavailable model score uses 0 with private provenance.
        Human correction retains the original machine raw_value and confidence, adds
        transcript_revision_id and source_observation_id, and changes effective text
        only in a new derived completed processing output. All materialized copies
        retain provenance privately, including predecessor IDs and original source.
      allOf:
        - if:
            properties:
              kind: { const: transcript.segment }
            required: [kind]
          then:
            properties:
              source_locator:
                pattern: '^media:start_ms=(0|[1-9][0-9]*);end_ms=(0|[1-9][0-9]*)$'
              raw_value: { minLength: 1 }
              normalized_value: { minLength: 1 }
        - if:
            properties:
              kind: { const: transcript.status }
            required: [kind]
          then:
            properties:
              normalized_value: { enum: [silence, no_audio] }
        - if:
            properties:
              source_observation_id: { type: string, format: uuid }
            required: [source_observation_id]
          then:
            properties:
              kind: { const: transcript.segment }
        - if:
            properties:
              transcript_revision_id: { type: string, format: uuid }
            required: [transcript_revision_id]
          then:
            required: [source_observation_id]
            properties:
              source_observation_id: { type: string, format: uuid }
              kind: { const: transcript.segment }
      type: object
      additionalProperties: false
      required: [id, case_id, evidence_id, processing_run_id, kind, source_locator, raw_value, normalized_value, extraction_confidence]
      properties:
        id: { type: string, format: uuid }
        case_id: { type: string, format: uuid }
        evidence_id: { type: string, format: uuid }
        processing_run_id: { type: string, format: uuid }
        kind: { type: string, description: 'Namespaced string, e.g. network.ip or gps.location' }
        source_locator:
          type: string
          minLength: 1
          description: >-
            Row/page/frame/byte range in original evidence. transcript.segment uses
            media:start_ms=<integer>;end_ms=<integer>, nonnegative elapsed milliseconds
            from the ORIGINAL artifact media timeline, end strictly greater than start
            and within decoded duration. Account for extracted track offsets; never
            substitute capture UTC, processing time or clip-local zero. Other locator
            forms are unchanged. See transcript conditional and runtime bounds checks.
        raw_value: { type: string }
        normalized_value: { type: string }
        observed_at_raw: { type: string }
        observed_at_utc: { type: string, format: date-time }
        detector_weight: { type: number }
        detector: { type: string }
        extraction_confidence: { type: number, minimum: 0, maximum: 1 }
        entity_key: { type: string, description: 'Candidate identifier, NOT a verified identity' }
        source_observation_id:
          type: string
          format: uuid
          description: >-
            Original same-case machine segment UUID for every materialized transcript
            copy, including unchanged segments without a correction. Omitted on the
            original machine segment itself. Enables correction UI to address the root.
        transcript_revision_id:
          type: string
          format: uuid
          description: Immutable human correction used by this derived segment, never a live overlay.
    CreateTranscriptRevision:
      type: object
      additionalProperties: false
      required: [processing_run_id, base_processing_run_id, expected_latest_revision_id, corrected_text, reason]
      properties:
        processing_run_id:
          type: string
          format: uuid
          description: Original completed machine run containing the path source observation; not the derived base run.
        base_processing_run_id:
          type: string
          format: uuid
          description: Expected latest completed same-evidence output to materialize; stale or lineage no longer present returns 409.
        expected_latest_revision_id:
          type: [string, 'null']
          format: uuid
          description: Latest revision for this original segment, or explicit null for the first; stale returns 409.
        corrected_text:
          type: string
          minLength: 1
          maxLength: 20000
          pattern: '\S'
          description: Full replacement effective segment text; [unclear] for unintelligible speech. No speaker identity or timestamp editing.
        reason: { type: string, minLength: 1, maxLength: 2000, pattern: '\S' }
    TranscriptRevision:
      type: object
      additionalProperties: false
      required: [id, case_id, evidence_id, source_observation_id, processing_run_id, base_processing_run_id, previous_revision_id, corrected_text, reason, actor_id, created_at, derived_processing_run_id, derived_observation_id]
      description: >-
        Immutable server-authored lineage, actor and time. All referenced records must
        join to the same authorized case/evidence. Source observation/run always identify
        the original machine segment, even on later corrections. derived_processing_run_id
        identifies a new complete completed materialization, not a mutation of any base.
        Original locator, raw machine text and machine confidence remain unchanged.
      properties:
        id: { type: string, format: uuid }
        case_id: { type: string, format: uuid }
        evidence_id: { type: string, format: uuid }
        source_observation_id: { type: string, format: uuid }
        processing_run_id: { type: string, format: uuid }
        base_processing_run_id: { type: string, format: uuid }
        previous_revision_id: { type: [string, 'null'], format: uuid }
        corrected_text: { type: string, minLength: 1, maxLength: 20000, pattern: '\S' }
        reason: { type: string, minLength: 1, maxLength: 2000, pattern: '\S' }
        actor_id: { type: string, minLength: 1 }
        created_at: { type: string, format: date-time }
        derived_processing_run_id: { type: string, format: uuid }
        derived_observation_id: { type: string, format: uuid }
    TranscriptRevisionPage:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TranscriptRevision' }
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1 }
        offset: { type: integer, minimum: 0 }
    Entity:
      type: object
      additionalProperties: false
      required: [id, case_id, kind, canonical_label, candidate_key, evidence_ids, observation_ids, confidence]
      properties:
        id: { type: string, format: uuid }
        case_id: { type: string, format: uuid }
        kind: { type: string, description: 'Device, person, account, etc.; does not establish real-world identity' }
        canonical_label: { type: string }
        candidate_key: { type: string, description: 'Namespaced normalized key, e.g. device:D-7' }
        evidence_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, format: uuid }
        observation_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, format: uuid }
        confidence: { type: number, minimum: 0, maximum: 1 }
    Event:
      type: object
      additionalProperties: false
      required: [id, case_id, kind, summary, evidence_ids, observation_ids, entity_ids, confidence]
      properties:
        id: { type: string, format: uuid }
        case_id: { type: string, format: uuid }
        kind: { type: string }
        summary: { type: string }
        evidence_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, format: uuid }
        observation_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, format: uuid }
        entity_ids:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
        observed_at_raw: { type: string }
        observed_at_utc: { type: string, format: date-time }
        confidence: { type: number, minimum: 0, maximum: 1 }
    GraphNode:
      description: >-
        id equals its source Evidence, Entity or Event UUID, or a deterministic
        source-row UUID for derived GPS locations. kind and entity_type describe
        the forensic category; camera represents media, not verified hardware. Reuse identity across analysis
        versions but partition storage by case_id and analysis_run_id.
      type: object
      additionalProperties: false
      required: [id, case_id, kind, label, evidence_ids]
      properties:
        id: { type: string, format: uuid }
        case_id: { type: string, format: uuid }
        kind: { type: string }
        label: { type: string }
        entity_type: { type: string }
        properties: { type: object, additionalProperties: true }
        evidence_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, format: uuid }
    GraphEdge:
      description: >-
        Source-backed relationships between forensic subjects, including explicit
        same-row GPS located_at and network assigned_ip relationships. Mere source
        membership is node.evidence_ids lineage, rendered as visual provenance
        rays rather than referenced_in or detected_in_frame graph edges.
      type: object
      additionalProperties: false
      required: [id, case_id, from_id, to_id, kind, evidence_ids, observation_ids, confidence]
      properties:
        id: { type: string, format: uuid }
        case_id: { type: string, format: uuid }
        from_id: { type: string, format: uuid }
        to_id: { type: string, format: uuid }
        kind: { type: string }
        label: { type: string }
        evidence_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, format: uuid }
        observation_ids:
          type: array
          minItems: 1
          uniqueItems: true
          description: Same-case input observations supporting this result; resolve source locators through Observation.
          items: { type: string, format: uuid }
        confidence: { type: number, minimum: 0, maximum: 1 }
    Graph:
      allOf:
        - if:
            anyOf:
              - properties:
                  nodes: { minItems: 1 }
                required: [nodes]
              - properties:
                  edges: { minItems: 1 }
                required: [edges]
          then:
            properties:
              analysis_run_id: { type: string, format: uuid }
            required: [analysis_run_id]
      type: object
      additionalProperties: false
      required: [case_id, nodes, edges]
      properties:
        case_id: { type: string, format: uuid }
        analysis_run_id: { type: string, format: uuid }
        nodes:
          type: array
          items: { $ref: '#/components/schemas/GraphNode' }
        edges:
          type: array
          items: { $ref: '#/components/schemas/GraphEdge' }
    FindingKind:
      type: string
      enum: [relationship, corroboration, conflict, gap, cluster, anomaly, hypothesis]
    Finding:
      type: object
      additionalProperties: false
      required: [id, case_id, analysis_run_id, kind, summary, evidence_ids, observation_ids, rule, confidence]
      properties:
        id: { type: string, format: uuid }
        case_id: { type: string, format: uuid }
        analysis_run_id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/FindingKind' }
        summary: { type: string }
        details:
          type: object
          additionalProperties: false
          required: [hypothesis, ai_generated, model]
          description: Optional AI executive hypothesis metadata; investigative prose requires human verification.
          properties:
            hypothesis: { type: string, minLength: 1, maxLength: 12000 }
            ai_generated: { type: boolean }
            model: { type: string, minLength: 1 }
        evidence_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, format: uuid }
        contradicting_evidence_ids:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
        rule: { type: string, description: 'Algorithm or rule version and basis' }
        observation_ids:
          type: array
          minItems: 1
          uniqueItems: true
          description: Same-case input observations supporting this result; resolve source locators through Observation.
          items: { type: string, format: uuid }
        confidence: { type: number, minimum: 0, maximum: 1 }
        entity_ids:
          type: array
          uniqueItems: true
          description: Same-case candidate entities involved, including cluster membership when applicable.
          items: { type: string, format: uuid }
        missing_information:
          type: array
          description: Explicitly unknown or missing information, not assertions of non-occurrence.
          items: { type: string, minLength: 1 }
    AnalysisInputSnapshot:
      type: object
      additionalProperties: false
      required: [case_id, evidence_ids, processing_run_ids, observation_ids, sha256]
      description: >-
        Immutable acceptance-time input manifest. UUID arrays are unique and
        sorted lexically. evidence_ids includes every uploaded item in the case;
        select one latest completed processing run per item by finished_at UTC
        then UUID, with all its observations. Empty arrays are allowed. sha256 is
        lowercase SHA-256 of UTF-8 compact JSON with sorted object keys for
        case_id, evidence_ids, processing_run_ids and observation_ids; exclude
        sha256 itself. Original evidence hashes and output records are immutable.
      properties:
        case_id: { type: string, format: uuid }
        evidence_ids:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
        processing_run_ids:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
        observation_ids:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
    AnalysisRun:
      allOf:
        - if:
            properties:
              status: { enum: [completed, failed] }
            required: [status]
          then:
            properties:
              finished_at: { type: string, format: date-time }
            required: [finished_at]
        - if:
            properties:
              status: { const: failed }
            required: [status]
          then:
            properties:
              error: { type: string, minLength: 1 }
            required: [error]
      type: object
      additionalProperties: false
      required: [id, case_id, status, trigger, algorithm_version, input_snapshot, created_at]
      properties:
        id: { type: string, format: uuid }
        case_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/RunStatus' }
        trigger: { type: string, enum: [initial, new_observations, manual] }
        algorithm_version: { type: string }
        input_snapshot: { $ref: '#/components/schemas/AnalysisInputSnapshot' }
        created_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        error: { type: string }
    Priority:
      type: string
      enum: [P1, P2, P3, P4]
    TriageFactor:
      type: object
      additionalProperties: false
      required: [name, value, weight, contribution, explanation, evidence_ids]
      properties:
        name:
          type: string
          enum: [relevance, connectivity, corroboration, gap_relevance, source_quality, conflict_relevance, temporal_proximity]
        value: { type: number, minimum: 0, maximum: 1 }
        weight: { type: number, minimum: 0, maximum: 1 }
        contribution: { type: number, minimum: 0, maximum: 100 }
        explanation: { type: string }
        evidence_ids:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
    TriageResult:
      type: object
      additionalProperties: false
      required: [id, case_id, evidence_id, analysis_run_id, score, priority, factors, explanation, created_at]
      properties:
        id: { type: string, format: uuid }
        case_id: { type: string, format: uuid }
        evidence_id: { type: string, format: uuid }
        analysis_run_id: { type: string, format: uuid }
        score: { type: number, minimum: 0, maximum: 100 }
        priority: { $ref: '#/components/schemas/Priority' }
        factors:
          type: array
          items: { $ref: '#/components/schemas/TriageFactor' }
        explanation: { type: string }
        created_at: { type: string, format: date-time }
    TriageEntry:
      type: object
      additionalProperties: false
      required: [evidence_id]
      properties:
        evidence_id: { type: string, format: uuid }
        latest_result: { $ref: '#/components/schemas/TriageResult' }
        effective_priority: { $ref: '#/components/schemas/Priority' }
        override: { $ref: '#/components/schemas/PriorityOverride' }
    CreateReview:
      type: object
      additionalProperties: false
      required: [decision, reason]
      properties:
        decision: { type: string, enum: [accepted, rejected, needs_investigation] }
        reason: { type: string, minLength: 1 }
    ReviewDecision:
      type: object
      additionalProperties: false
      required: [id, case_id, finding_id, actor_id, decision, reason, created_at]
      properties:
        id: { type: string, format: uuid }
        case_id: { type: string, format: uuid }
        finding_id: { type: string, format: uuid }
        actor_id: { type: string }
        decision: { type: string, enum: [accepted, rejected, needs_investigation] }
        reason: { type: string }
        created_at: { type: string, format: date-time }
    CreateOverride:
      type: object
      additionalProperties: false
      required: [priority, reason]
      properties:
        priority: { $ref: '#/components/schemas/Priority' }
        reason: { type: string, minLength: 1 }
    PriorityOverride:
      type: object
      additionalProperties: false
      required: [id, case_id, evidence_id, actor_id, priority, reason, created_at]
      properties:
        id: { type: string, format: uuid }
        case_id: { type: string, format: uuid }
        evidence_id: { type: string, format: uuid }
        actor_id: { type: string }
        priority: { $ref: '#/components/schemas/Priority' }
        reason: { type: string }
        created_at: { type: string, format: date-time }
    ReportRequest:
      type: object
      additionalProperties: false
      required: [analysis_run_id, finding_ids]
      properties:
        analysis_run_id: { type: string, format: uuid }
        finding_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
        scope: { type: string, maxLength: 4000, default: '' }
        notes: { type: string, maxLength: 8000, default: '' }
        allow_remote: { type: boolean, default: false }
    ReportClaim:
      type: object
      additionalProperties: false
      required: [text, observation_ids]
      properties:
        text: { type: string, minLength: 1, maxLength: 4100 }
        observation_ids:
          type: array
          minItems: 1
          maxItems: 32
          items: { type: string, format: uuid }
    GeneratedReport:
      type: object
      additionalProperties: false
      required: [case_id, analysis_run_id, provenance_id, model_version, prompt_template_version, created_at, sections, citations, coverage]
      properties:
        case_id: { type: string, format: uuid }
        analysis_run_id: { type: string, format: uuid }
        provenance_id: { type: string, format: uuid }
        model_version: { type: string }
        prompt_template_version: { type: string }
        created_at: { type: string, format: date-time }
        sections:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: object
            additionalProperties: false
            required: [heading, claims]
            properties:
              heading: { type: string, enum: [Executive summary, Recorded chronology, Evidence assessment, Uncertainties and follow-up] }
              claims:
                type: array
                maxItems: 6
                items: { $ref: '#/components/schemas/ReportClaim' }
        citations:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/AnswerCitation' }
        coverage:
          type: object
          additionalProperties: false
          required: [observations_included, observations_total, sources_included, sources_total, truncated_observations]
          properties:
            observations_included: { type: integer, minimum: 0 }
            observations_total: { type: integer, minimum: 0 }
            sources_included: { type: integer, minimum: 0 }
            sources_total: { type: integer, minimum: 0 }
            truncated_observations: { type: integer, minimum: 0 }
    CaseQuestion:
      type: object
      additionalProperties: false
      required: [question]
      properties:
        question: { type: string, minLength: 1, maxLength: 2000 }
    AnswerCitation:
      type: object
      additionalProperties: false
      required: [claim, evidence_id, source_locator]
      properties:
        claim: { type: string, minLength: 1, description: 'Factual assertion in the answer supported by this citation' }
        evidence_id: { type: string, format: uuid }
        source_locator: { type: string, minLength: 1, description: 'Row/page/frame/byte range or entire original artifact' }
        observation_id: { type: string, format: uuid }
    CaseAnswer:
      allOf:
        - if:
            properties:
              supported: { const: true }
            required: [supported]
          then:
            properties:
              citations: { minItems: 1 }
          else:
            properties:
              citations: { maxItems: 0 }
      type: object
      additionalProperties: false
      required: [case_id, question, supported, answer, citations, retrieval_version]
      properties:
        case_id: { type: string, format: uuid }
        question: { type: string }
        supported: { type: boolean }
        answer: { type: string, description: 'When unsupported, explain insufficient evidence; make no factual claim.' }
        citations:
          type: array
          description: 'One or more same-case source citations per supported factual claim; empty when unsupported.'
          items: { $ref: '#/components/schemas/AnswerCitation' }
        retrieval_version: { type: string }
        model_version: { type: string }
        prompt_template_version: { type: string }
        provenance_id:
          type: string
          format: uuid
          description: Authorized internal provenance record reference; never a storage path or public prompt dump.
    AuditEvent:
      type: object
      additionalProperties: false
      required: [id, case_id, actor_id, action, target_id, created_at]
      properties:
        id: { type: string, format: uuid }
        case_id: { type: string, format: uuid }
        actor_id: { type: string }
        action: { type: string }
        target_id: { type: string }
        reason: { type: string }
        created_at: { type: string, format: date-time }
    CasePage:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Case' }
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1 }
        offset: { type: integer, minimum: 0 }
    EvidencePage:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Evidence' }
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1 }
        offset: { type: integer, minimum: 0 }
    ObservationPage:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Observation' }
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1 }
        offset: { type: integer, minimum: 0 }
    EntityPage:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Entity' }
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1 }
        offset: { type: integer, minimum: 0 }
    EventPage:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Event' }
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1 }
        offset: { type: integer, minimum: 0 }
    FindingPage:
      allOf:
        - if:
            anyOf:
              - properties:
                  items: { minItems: 1 }
                required: [items]
              - properties:
                  total: { minimum: 1 }
                required: [total]
          then:
            properties:
              analysis_run_id: { type: string, format: uuid }
            required: [analysis_run_id]
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        analysis_run_id:
          type: string
          format: uuid
          description: Selected completed snapshot ID; required whenever a completed run is selected, even for an empty page. Absent only when no completed analysis exists.
        items:
          type: array
          items: { $ref: '#/components/schemas/Finding' }
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1 }
        offset: { type: integer, minimum: 0 }
    TriagePage:
      allOf:
        - if:
            properties:
              items:
                contains:
                  type: object
                  properties:
                    latest_result: { $ref: '#/components/schemas/TriageResult' }
                  required: [latest_result]
            required: [items]
          then:
            properties:
              analysis_run_id: { type: string, format: uuid }
            required: [analysis_run_id]
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        analysis_run_id:
          type: string
          format: uuid
          description: Selected completed snapshot ID; required whenever a completed run is selected, even for an empty page. Absent only when no completed analysis exists.
        items:
          type: array
          items: { $ref: '#/components/schemas/TriageEntry' }
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1 }
        offset: { type: integer, minimum: 0 }
    AuditPage:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditEvent' }
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1 }
        offset: { type: integer, minimum: 0 }
